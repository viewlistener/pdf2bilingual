interface:
  display_name: "PDF2Bilingual"
  short_description: "Extract one paper PDF, translate it with a fixed bilingual template, and render bilingual.pdf"
  default_prompt: "Use $pdf2bilingual to process one specified paper PDF. First build a source-faithful source.md in reading order. Then create bilingual.md by following references/translation-template.md exactly: keep the English block first, add a faithful Chinese translation directly after it, preserve headings, captions, lists, formulas, figure/table numbering, experimental details, units, and values, stop before References by default, and do not summarize or rewrite into a reading note. Finally render bilingual.pdf in the same folder."
policy:
  allow_implicit_invocation: true
