interface:
  display_name: "PDF2Bilingual"
  short_description: "Extract one paper PDF, translate it with a fixed bilingual template, and render bilingual.pdf"
  default_prompt: "Use $pdf2bilingual to process one specified paper PDF. First build a source-faithful source.md in reading order. Then use scripts/bilingual_guard.py and references/translation-template.md to create a block-marked bilingual.md: preserve the English source block first, add exactly one faithful Chinese block after it, keep hidden provenance and block markers, preserve headings, captions, lists, formulas, figure/table numbering, experimental details, units, and values, stop before References by default, and do not summarize or merge blocks. Regenerate each Chinese block directly from the current English source block; do not clean or repair an older Chinese draft in place. Verify bilingual.md against the current source.md before rendering. Never reuse a stale bilingual.md after source.md changes. Finally render bilingual.pdf in the same folder."
policy:
  allow_implicit_invocation: true
